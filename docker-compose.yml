# CI, on this machine, in one step:
#
#   docker compose run --rm ci
#
# The job in .github/workflows/ci.yml needs an Ubuntu toolchain and a FoundationDB cluster,
# which is not what a developer's machine is — least of all a Windows one. So the machine
# lends a container the repository and nothing else, and the container is the same
# ubuntu-24.04 with the same FDB. The debs live in a named volume, so the second run is
# build-and-play only.
#
# `docker compose run --rm shell` is the same container with the cluster up and a prompt.
services:
  ci: &ci
    image: ubuntu:24.04
    working_dir: /repo
    environment:
      FDB_VERSION: "7.3.76"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      CI_MODE: play
    volumes:
      - .:/repo
      - fdb-debs:/root/fdb-debs
    command: ["bash", "/repo/ci/inside.sh"]

  shell:
    <<: *ci
    environment:
      FDB_VERSION: "7.3.76"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      CI_MODE: shell

  # `docker compose run --rm bench` builds MuJoCo and asks how many players fit on one core.
  # It is its own service rather than a flag on `ci` because it is a long build the play run
  # does not need, and because the answer is a number to read rather than a check to pass.
  bench:
    <<: *ci
    environment:
      FDB_VERSION: "7.3.76"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      CI_MODE: bench

volumes:
  fdb-debs:
